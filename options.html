<!doctype html>
<html><head><meta charset="utf-8"><title>Prod Click Guard options</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; padding: 16px; width: 380px; color: #1a1a1a; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input[type=text], input[type=number], textarea { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; }
  textarea { height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .row label { margin: 0; }
  small { color: #666; }
  button { margin-top: 16px; padding: 8px 16px; font: inherit; }
  #status { margin-left: 10px; color: #2e7d32; }
</style></head>
<body>
  <h2 style="margin-top:0">CommerceIQ Prod Click Guard</h2>
  <div class="row"><input type="checkbox" id="enabled"><label for="enabled">Enabled</label></div>
  <div class="row"><input type="checkbox" id="showBanner"><label for="showBanner">Show red PRODUCTION banner</label></div>

  <label for="prodPattern">Prod hostname regex</label>
  <input type="text" id="prodPattern">
  <small>Default matches <code>tenant.commerceiq.ai</code>.</small>

  <label for="nonProdMarkers">Non-prod markers (one per line)</label>
  <textarea id="nonProdMarkers"></textarea>
  <small>If the hostname contains any of these it is treated as non-prod, e.g. <code>databricks-qa</code>.</small>

  <label for="snoozeMinutes">Snooze duration (minutes)</label>
  <input type="number" id="snoozeMinutes" min="1" max="120">

  <button id="save">Save</button><span id="status"></span>
  <script src="options.js"></script>
</body></html>
